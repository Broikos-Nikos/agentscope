# Build, gate, and publish the page.
#
# Nine gates, and all of them run here.
#
# `npm run build` runs five before vite writes anything: the invisible character
# scan, the licence claim against the LICENSE and the corpus attribution, every
# figure recomputed from the committed log, every record checked against the
# hand labels that decide what counts, and every number in the README checked
# against those figures.
#
# Four need a served page and a real browser, so they run in their own job
# against the built output, sharing one server rather than starting one each:
# every figure the page states is held to the corpus, the list a reader opens an
# entry with is held to a target a thumb can hit and a keyboard path of sixteen
# stops, the first screen is held to saying what kind of thing wrote the log,
# and the recording at the top of the README is held to the page it claims to
# be.
#
# They exist because of specific defects, each recorded in the file that gates
# it: a count produced by matching words rather than by reading, a mark 2.3
# pixels wide on a phone, an opening a recruiter could not tell apart from an HR
# metaphor, and a recording that went on showing a headline the page no longer
# had.
#
# Nothing deploys unless all of them pass, and that promise is enforced twice:
# by the `needs:` on the deploy job, and by the fact that the two jobs running
# other people's code cannot deploy even if they wanted to. See the permissions
# note below.
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing by default. `pages: write` and `id-token: write` are the pair that
# creates a Pages deployment, and they are granted on the deploy job alone.
#
# `build` and `verify` run `npm ci`, which executes dependency postinstall
# hooks, and `npx playwright install --with-deps`, which installs system
# packages as root. Granting deployment credentials to the jobs that run other
# people's code, and then promising in the header that nothing deploys unless
# the gates pass, is a guarantee contradicted by the lines above it.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # persist-credentials: false, so the job's token is not left in
      # .git/config where an install hook could read it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist
          retention-days: 1
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  verify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      # The gates drive the page a visitor gets, not the dev server. The server
      # comes from tools/serve.mjs: one preview on a port the operating system
      # hands out, proved byte for byte against dist/index.html before anything
      # measures it, and killed by a process group the spawn actually creates.
      - run: npm run verify

  deploy:
    # Only after all of them, and the only job holding the permissions that can
    # publish anything. A page whose count is wrong must not reach anyone just
    # because it built.
    needs: [build, verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
