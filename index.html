<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="An agent kept a development log for five days and 108 entries. Six failure modes recur in it, every one with a run behind it, and it wrote each one down as a lesson before making it again."
    />
    <!--
      Inline, so there is no second request and no 404 in the console of the
      first person who opens it. Six rows of marks, which is the thing this
      site draws.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23080604'/%3E%3Cg fill='%239a8f88'%3E%3Crect x='2' y='3' width='2' height='2'/%3E%3Crect x='7' y='3' width='2' height='2'/%3E%3Crect x='2' y='7' width='2' height='2'/%3E%3Crect x='11' y='7' width='2' height='2'/%3E%3Crect x='7' y='11' width='2' height='2'/%3E%3C/g%3E%3Crect x='11' y='11' width='2' height='2' fill='%23ff6a00'/%3E%3C/svg%3E"
    />
    <title>agentscope</title>
  </head>
  <body>
    <header>
      <p class="wordmark">AGENTSCOPE</p>
      <h1 data-headline></h1>
      <p class="standfirst" data-standfirst></p>
    </header>

    <main>
      <!--
        One control, and one only. A reader is choosing which failure to look at,
        and everything else on this page is a consequence of that choice.
      -->
      <nav class="modes" data-modes aria-label="failure modes"></nav>

      <p class="status" data-status>loading</p>

      <noscript>
        <style>
          [data-status], .modes, .grid { display: none }
        </style>
        <p class="status">
          This page draws a development log as a grid you can pick through, so it
          needs javascript to do anything. Every number it draws is in the README,
          which needs none.
        </p>
      </noscript>

      <!--
        Six rows, not one. Measured before it was drawn: 6 of the 25 entries that
        carry a mode carry two or more, so a single mark in a single colour would
        be wrong about 24% of the marks it drew.
      -->
      <section class="grid" data-grid></section>

      <!--
        AHS-F1 and AHS-F4. The grid is the picture and it is not a control. A
        mark is 2.31 pixels wide at 390 and 2.03 at 360, against the 24 by 24 of
        WCAG 2.5.8, so a fingertip covers ten of them and nobody can open the
        one they mean; and from the keyboard the grid is 648 buttons, so Enter
        on a mark opened an entry 642 Tab presses away from it.

        Picking a mode lists that mode's entries here, full width, at most ten
        of them. That is the whole of what a phone reader needs, the whole of
        what a keyboard reader needs, and it lets the grid stop pretending to be
        a tap target.
      -->
      <section class="picks" data-picks hidden aria-label="entries in the chosen mode"></section>

      <p class="caption" data-caption></p>

      <!-- What a click opens: the real entry, not a summary of it. -->
      <article class="entry" data-entry hidden></article>
    </main>

    <footer data-footer></footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
